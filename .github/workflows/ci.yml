name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Node ${{ matrix.node }}, DSH ${{ matrix.dsh }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node: [22.22.3, 24.11.1]
        dsh: [0.1.5-rc.2, 0.1.6-alpha.2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install isolated upstream
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/upstream"
          echo '{"private":true}' > "$RUNNER_TEMP/upstream/package.json"
          npm install --prefix "$RUNNER_TEMP/upstream" --ignore-scripts --no-audit --no-fund "@deepseek-ai/dsh@${{ matrix.dsh }}"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run release gate
        env:
          DSH_UPSTREAM_ENTRY: ${{ runner.temp }}/upstream/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: npm run check
      - name: Verify native Session Gateway
        shell: bash
        run: node test/session-gateway.e2e.mts "$RUNNER_TEMP/upstream" "$GITHUB_WORKSPACE/node_modules/dsh-harmony/lib/bin.js"
      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts
