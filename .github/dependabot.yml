version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      dsh-release:
        patterns:
          - '@deepseek-ai/dsh*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      - dependency-name: react-grab
        update-types:
          - version-update:semver-minor
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
