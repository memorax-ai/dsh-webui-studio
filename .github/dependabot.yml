version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      dsh-release:
        patterns:
          - '@deepseek-ai/dsh*'
    ignore:
      # DSH 0.1.5-rc.3 requires Cordis 4.0.2 and group 1.0.2; newer loaders
      # require newer Cordis. Update these limits with the DSH dev baseline.
      - dependency-name: '@deepseek-ai/cordis'
        versions:
          - '>4.0.2'
      - dependency-name: '@deepseek-ai/cordis-plugin-loader'
        versions:
          - '>1.0.3'
      - dependency-name: '@deepseek-ai/cordis-plugin-group'
        versions:
          - '>1.0.2'
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      - dependency-name: react-grab
        update-types:
          - version-update:semver-minor
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
