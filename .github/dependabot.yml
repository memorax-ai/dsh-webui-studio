version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      dsh-release:
        patterns:
          - '@deepseek-ai/dsh*'
    ignore:
      # These versions fail peer resolution with the DSH 0.1.5-rc.3 baseline,
      # including when Cordis and its loader are upgraded together.
      # Reassess them when changing the coordinated DSH development release.
      - dependency-name: '@deepseek-ai/cordis'
        versions:
          - '4.0.4'
      - dependency-name: '@deepseek-ai/cordis-plugin-loader'
        versions:
          - '1.0.5'
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      - dependency-name: react-grab
        update-types:
          - version-update:semver-minor
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
